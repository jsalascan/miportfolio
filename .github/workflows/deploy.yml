name: Deploy en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # El worker tiene su propio pnpm-workspace.yaml, así que se instala aparte
  # y no comparte node_modules con el portfolio.
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias del worker
        run: pnpm install --frozen-lockfile
        working-directory: worker

      - name: Tests del worker
        run: pnpm test
        working-directory: worker

      - name: Comprobar tipos del worker
        run: pnpm exec tsc --noEmit
        working-directory: worker

  build:
    needs: test-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
